type: object
required:
  -id
  -status
  -amount
  -currency
properties:
  id:
    type: string
    example: "ch_3MtwxPEby7qXAgqq1T62Zq1"
  status:
    type: string
    enum: [succeeded, pending, failed]
    example: "succeeded"
  amount:
    type: integer
    example: 1000
  currency:
    type: string
    example: "usd"